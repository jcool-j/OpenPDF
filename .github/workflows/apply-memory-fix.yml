name: Verify memory fix / בדיקת תיקון זיכרון
on:
  push:
    branches: [fix/recent-issues-2026-11-18]
    paths: [.github/workflows/apply-memory-fix.yml]
permissions: {}
env:
  PATCH_00: 
jobs:
  verify:
    name: Read-only browser verification / בדיקת דפדפן ללא הרשאת כתיבה
    if: github.repository == 'jcool-j/OpenPDF' && github.ref == 'refs/heads/fix/recent-issues-2026-11-18'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed patch / החלת טלאי שנבדק
        shell: python
        run: |
          import os, base64, gzip, hashlib, subprocess
          blob=base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('PATCH_')))
          assert hashlib.sha256(blob).hexdigest() == '44f7b0f2d86a6af1e294b311de62012893268dd4bbb62270e8e9d452eb6ed7e8'
          subprocess.run(['git','apply','--index','--binary','-'],input=gzip.decompress(blob),check=True)
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Real browser and memory regression / בדיקות דפדפן וזיכרון אמיתיות
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 1420 > /tmp/openpdf-vite.log 2>&1 & server=$!
          trap 'kill "$server"; wait "$server" 2>/dev/null || true' EXIT
          npm run test:browser
          npm run test:memory
  commit:
    name: Commit without executing project code / שמירה ללא הרצת קוד הפרויקט
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact reviewed patch / החלת אותו טלאי שנבדק
        shell: python
        run: |
          import os, base64, gzip, hashlib, subprocess
          blob=base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('PATCH_')))
          assert hashlib.sha256(blob).hexdigest() == '44f7b0f2d86a6af1e294b311de62012893268dd4bbb62270e8e9d452eb6ed7e8'
          subprocess.run(['git','apply','--index','--binary','-'],input=gzip.decompress(blob),check=True)
      - name: Remove temporary files and commit / הסרת קבצים זמניים ושמירה
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/apply-memory-fix.yml .github/workflows/.github/workflows/verify-windows.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'Release inactive page rasters, preserve editing state / שחרור משטחי ציור ושמירת מצב עריכה'
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/fix/recent-issues-2026-11-18
