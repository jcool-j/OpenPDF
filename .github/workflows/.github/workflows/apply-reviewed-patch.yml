name: Apply verified issue fixes / החלת תיקונים מאומתים
on:
  push:
    branches: [fix/recent-issues-2026-11-18]
    paths: [.github/workflows/apply-reviewed-patch.yml]
permissions: {}
env:
  PATCH_00: 
  PATCH_01: 
  PATCH_02: 
  PATCH_03: 
  PATCH_04: 
  PATCH_05: 

jobs:
  verify:
    name: Read-only frontend verification / בדיקת ממשק ללא הרשאת כתיבה
    if: github.repository == 'jcool-j/OpenPDF' && github.ref == 'refs/heads/fix/recent-issues-2026-11-18'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and apply exact patch / בדיקת הטלאי והחלתו
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, struct, subprocess
          data = base64.b64decode(''.join(os.environ[key] for key in sorted(os.environ) if key.startswith('PATCH_')))
          assert hashlib.sha256(data).hexdigest() == '56869930ef68f548c732d8f18f4cf449fa6646269e78c71cf1255434332f9d8f'
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=gzip.decompress(data), check=True)
          icon = pathlib.Path('src-tauri/icons/icon.ico').read_bytes()
          for index in range(struct.unpack_from('<H', icon, 4)[0]):
              w, h, _, _, _, _, size, offset = struct.unpack_from('<BBBBHHII', icon, 6 + 16 * index)
              if w == h == 0:
                  png = icon[offset:offset + size]
                  assert png.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10]))
                  pathlib.Path('src-tauri/icons/icon.png').write_bytes(png)
                  break
          else:
              raise RuntimeError('Missing 256px PNG frame')
          subprocess.run(['git', 'add', 'src-tauri/icons/icon.png'], check=True)
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Real browser regression / בדיקת דפדפן אמיתי
        run: |
          npx playwright install --with-deps chromium
          npm run dev > /tmp/openpdf-vite.log 2>&1 & server=$!
          trap 'kill "$server"; wait "$server" 2>/dev/null || true' EXIT
          npm run test:browser
  commit:
    name: Commit verified patch only / שמירת הטלאי המאומת בלבד
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact patch without running project code / החלת הטלאי ללא הרצת קוד הפרויקט
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, struct, subprocess
          data = base64.b64decode(''.join(os.environ[key] for key in sorted(os.environ) if key.startswith('PATCH_')))
          assert hashlib.sha256(data).hexdigest() == '56869930ef68f548c732d8f18f4cf449fa6646269e78c71cf1255434332f9d8f'
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=gzip.decompress(data), check=True)
          icon = pathlib.Path('src-tauri/icons/icon.ico').read_bytes()
          for index in range(struct.unpack_from('<H', icon, 4)[0]):
              w, h, _, _, _, _, size, offset = struct.unpack_from('<BBBBHHII', icon, 6 + 16 * index)
              if w == h == 0:
                  png = icon[offset:offset + size]
                  assert png.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10]))
                  pathlib.Path('src-tauri/icons/icon.png').write_bytes(png)
                  break
          else:
              raise RuntimeError('Missing 256px PNG frame')
          subprocess.run(['git', 'add', 'src-tauri/icons/icon.png'], check=True)
      - name: Commit to authorized branch / שמירה לענף שאושר
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'Fix recent PDF issues / תיקון בעיות PDF אחרונות'
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/fix/recent-issues-2026-11-18
