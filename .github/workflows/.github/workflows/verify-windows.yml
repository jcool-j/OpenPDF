name: Windows build only / בדיקת בנייה בלבד ב-Windows
on:
  push:
    branches: [fix/recent-issues-2026-11-18]
    paths: [.github/workflows/verify-windows.yml]
permissions:
  contents: read
jobs:
  windows-build-only:
    name: Compile and package, not native E2E / הידור ואריזה בלבד
    if: github.repository == 'jcool-j/OpenPDF' && github.ref == 'refs/heads/fix/recent-issues-2026-11-18'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install without lifecycle scripts / התקנה ללא סקריפטי התקנה
        run: npm ci --ignore-scripts
      - name: Frontend tests / בדיקות ממשק
        run: npm test
      - name: Frontend build / בניית ממשק
        run: npm run build
      - name: Native tests / בדיקות קוד מקומי
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Standard NSIS and MSI packages, not installation or runtime / אריזת מתקינים בלבד
        run: npm run tauri build -- --ci
      - name: Confirm output, do not upload or release / בדיקת תוצרים ללא העלאה או הפצה
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe,src-tauri/target/release/bundle/msi/*.msi | Select-Object Name,Length
          if (!(Test-Path src-tauri/target/release/openpdf.exe)) { throw 'Missing executable / חסר קובץ הרצה' }
