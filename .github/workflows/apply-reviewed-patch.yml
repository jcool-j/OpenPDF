name: Apply verified issue fixes / החלת תיקונים מאומתים
on:
  push:
    branches: [fix/recent-issues-2026-11-18]
    paths: [.github/workflows/apply-reviewed-patch.yml]
permissions: {}
env:
  PATCH_00: 
jobs:
  verify:
    name: Read-only frontend verification / בדיקת ממשק ללא הרשאת כתיבה
    if: github.repository == 'jcool-j/OpenPDF' && github.ref == 'refs/heads/fix/recent-issues-2026-11-18'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and apply exact patch / בדיקת הטלאי והחלתו
        shell: python
        run: |
          import base64, gzip, hashlib, os, subprocess
          data = base64.b64decode(os.environ['PATCH_00'])
          assert hashlib.sha256(data).hexdigest() == '9910de3cf56857902828bbc4a1b89ef72b8f0983b92000fd864315b404915564'
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=gzip.decompress(data), check=True)
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Real browser regression / בדיקת דפדפן אמיתי
        run: |
          npx playwright install --with-deps chromium
          npm run dev > /tmp/openpdf-vite.log 2>&1 & server=$!
          trap 'kill "$server"; wait "$server" 2>/dev/null || true' EXIT
          npm run test:browser
  commit:
    name: Commit verified patch only / שמירת הטלאי המאומת בלבד
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact patch without running project code / החלת הטלאי ללא הרצת קוד הפרויקט
        shell: python
        run: |
          import base64, gzip, hashlib, os, subprocess
          data = base64.b64decode(os.environ['PATCH_00'])
          assert hashlib.sha256(data).hexdigest() == '9910de3cf56857902828bbc4a1b89ef72b8f0983b92000fd864315b404915564'
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=gzip.decompress(data), check=True)
      - name: Commit to authorized branch / שמירה לענף שאושר
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'Complete notices and print resources / השלמת רישיונות ומשאבי הדפסה'
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/fix/recent-issues-2026-11-18
